           <span class="voorbeeld">C’est son père.</span> = Het is zijn vader.</p>
        <p>De vorm hangt af van het zelfstandig naamwoord dat erachter komt: <strong>mannelijk</strong>, <strong>vrouwelijk</strong> of <strong>meervoud</strong>.</p>
