<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Alle huiswerk-apps voor klas 1BC van De Amersfoortse Berg op één plek">
<title>Huiswerk 1BC · De Amersfoortse Berg</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
  /* Zelfde huisstijl als de leermodule ("Rustig schrift"): rustige achtergrond, Lexend, de vakkleur als accent. */
  :root {
    --bg: #F4F6F9; --kaart: #FFFFFF; --tekst: #222833; --ink: #1C2B4A; --zacht: #5F6B7E; --rand: #DFE4EC; --rand2: #C9D1DD;
    --accent: #1C2B4A; --accent-zacht: #EDF1F7; --nieuw: #1D8048; --nieuwbg: #E3F4EA; --waarschuw: #9A5B00; --waarschuwbg: #FFF2DB;
    --btntekst: #FFFFFF; --schaduw: 0 1px 2px rgba(20,30,50,.05), 0 4px 14px rgba(20,30,50,.05); --radius: 14px;
    --vak-l: 62%; --vak-d: 34%; --vakbg-l: 75%; --vakbg-d: 95%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121821; --kaart: #1A222E; --tekst: #E6EAF2; --ink: #BFD0FF; --zacht: #9AA4B6; --rand: #2A3443; --rand2: #3A4657;
      --accent: #BFD0FF; --accent-zacht: #222C3A; --nieuw: #4CC983; --nieuwbg: #163222; --waarschuw: #F2B04A; --waarschuwbg: #3A2C12;
      --btntekst: #0F1624; --schaduw: 0 1px 2px rgba(0,0,0,.3);
      --vak-l: 75%; --vak-d: 72%; --vakbg-l: 35%; --vakbg-d: 19%;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--tekst); font: 16px/1.5 "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 960px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
  header { display: flex; align-items: center; gap: 10px; min-height: 56px; margin-bottom: 6px; }
  header h1 { font-size: clamp(1.5rem, 5vw, 1.9rem); margin: 0; line-height: 1.15; color: var(--ink); font-weight: 700; text-wrap: balance; }
  .terug { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--rand); background: var(--kaart); color: var(--ink); text-decoration: none; font-size: 20px; }
  .kruimels { font-size: .9rem; color: var(--zacht); margin: 0 0 14px; }
  .kruimels a { color: var(--ink); text-decoration: none; display: inline-block; padding: 10px 0; font-weight: 500; }
  h2 { font-size: .85rem; font-weight: 600; color: var(--zacht); margin: 28px 0 10px; letter-spacing: .02em; }
  a { color: inherit; }
  a:focus-visible, summary:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  /* Komende toetsen */
  .toetsen { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .toets { position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 12px 16px 12px 20px; background: var(--kaart); border: 1px solid var(--rand); border-radius: var(--radius); box-shadow: var(--schaduw); text-decoration: none; }
  .toets::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: hsl(var(--tint) var(--vak-l) 50%); }
  .toets .dagen { flex: none; min-width: 54px; text-align: center; font-weight: 700; font-size: 1.6rem; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .toets .dagen small { display: block; font-size: .72rem; font-weight: 500; color: var(--zacht); margin-top: 4px; }
  .toets.binnenkort .dagen { color: var(--waarschuw); }
  .toets .wat { min-width: 0; }
  .toets .wat strong { display: block; font-weight: 600; }
  .toets .wat span { color: var(--zacht); font-size: .88rem; }

  /* Vak-tegels */
  .tegels { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .tegel { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 4px; min-height: 136px; padding: 16px; text-decoration: none; border-radius: var(--radius); background: var(--kaart); border: 1px solid var(--rand); box-shadow: var(--schaduw); transition: transform .12s ease; }
  .tegel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: hsl(var(--tint) var(--vak-l) 50%); }
  .tegel:active { transform: scale(.98); }
  .tegel .emoji { font-size: 34px; line-height: 1; margin-bottom: auto; padding-top: 4px; }
  .tegel .naam { font-weight: 600; font-size: 1.05rem; color: var(--ink); }
  .tegel .info { font-size: .8rem; color: var(--zacht); }
  .tegel .badge { position: absolute; top: 14px; right: 12px; }

  /* Lijsten van blokken en apps */
  .lijst { display: grid; gap: 8px; }
  .rij { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 16px; background: var(--kaart); border: 1px solid var(--rand); border-radius: 12px; text-decoration: none; }
  @media (hover: hover) { .rij:hover, .tegel:hover, .toets:hover { border-color: var(--rand2); } }
  .rij .icoon { flex: none; font-size: 24px; width: 32px; text-align: center; }
  .rij .tekst { flex: 1; min-width: 0; }
  .rij .titel { font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--ink); }
  .rij .sub { color: var(--zacht); font-size: .85rem; margin-top: 2px; }
  .rij .pijl { flex: none; color: var(--zacht); font-size: 22px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .72rem; font-weight: 600; background: var(--nieuwbg); color: var(--nieuw); }
  .label { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .72rem; font-weight: 600; background: var(--accent-zacht); color: var(--ink); }

  details.archief { margin-top: 26px; }
  details.archief summary { display: flex; align-items: center; gap: 8px; min-height: 48px; cursor: pointer; font-weight: 600; color: var(--zacht); list-style: none; }
  details.archief summary::-webkit-details-marker { display: none; }
  details.archief summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--zacht); border-bottom: 2px solid var(--zacht); transform: rotate(-45deg); transition: transform .15s; margin-right: 2px; }
  details.archief[open] summary::before { transform: rotate(45deg); }
  details.archief .lijst, details.archief .tegels { opacity: .8; }

  .leeg, .fout { background: var(--kaart); border: 1px solid var(--rand); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--zacht); }
  .fout { color: var(--tekst); }
  .fout .groot { font-size: 44px; }
  .fout code { background: var(--bg); padding: 2px 6px; border-radius: 6px; font-size: .85rem; }
  button { font: inherit; font-weight: 600; min-height: 48px; padding: 0 22px; border: 0; border-radius: 12px; background: var(--accent); color: var(--btntekst); cursor: pointer; margin-top: 12px; }
  .wie { background: var(--kaart); border: 1px solid var(--rand); border-radius: var(--radius); box-shadow: var(--schaduw); padding: 22px 18px; max-width: 520px; }
  .wie h2 { margin: 0 0 10px; font-size: 1.35rem; color: var(--ink); letter-spacing: 0; }
  .wie p { margin: 0 0 10px; }
  .wie form { display: flex; flex-wrap: wrap; gap: 10px; }
  .wie input { flex: 1 1 200px; min-height: 52px; padding: 0 16px; font: inherit; font-size: 1.15rem; border: 1.5px solid var(--rand2); border-radius: 12px; background: var(--kaart); color: var(--tekst); }
  .wie input:focus { outline: none; border-color: var(--ink); }
  .wie form button { margin-top: 0; min-height: 52px; }
  .wie .klein { color: var(--zacht); font-size: .85rem; margin: 14px 0 0; }
  .namen { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .namen button { margin-top: 0; background: var(--kaart); color: var(--ink); border: 1.5px solid var(--rand2); }
  .profiel { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rand); background: var(--kaart); text-decoration: none; font-size: .9rem; font-weight: 500; max-width: 45vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reeks { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: var(--waarschuwbg); color: var(--waarschuw); font-weight: 600; font-size: .82rem; }
  .reeks + .profiel { margin-left: 0; }
  header .reeks { margin-left: auto; }
  .lm-i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .groet { margin: 0 0 4px; color: var(--zacht); }
  .school { margin: -8px 0 14px; color: var(--zacht); font-size: .85rem; font-weight: 500; }
  footer { margin-top: 40px; text-align: center; font-size: .8rem; color: var(--zacht); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<!-- Anonieme bezoekersteller (GoatCounter): geen cookies, geen namen, geen cijfers. Overzicht: https://ltmarx.goatcounter.com -->
<script data-goatcounter="https://ltmarx.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

<body>
<div class="wrap">
  <header id="kop"><h1>Huiswerk 1BC</h1></header>
  <main id="inhoud" aria-live="polite"><p class="leeg">Even laden…</p></main>
  <footer id="voet"></footer>
</div>

<script>
(function () {
  'use strict';

  var DAG = 86400000;
  var NIEUW_DAGEN = 7;
  var manifest = null;
  var kop = document.getElementById('kop');
  var inhoud = document.getElementById('inhoud');
  var voet = document.getElementById('voet');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function vandaag() {
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function parseDatum(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }

  function dagenTot(s) {
    var d = parseDatum(s);
    return d ? Math.round((d - vandaag()) / DAG) : null;
  }

  function mooieDatum(s) {
    var d = parseDatum(s);
    return d ? d.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
  }

  function isNieuw(app) {
    var t = Date.parse(app.toegevoegd || app.laatstGewijzigd);
    return !isNaN(t) && Date.now() - t < NIEUW_DAGEN * DAG;
  }

  function tint(tekst) {
    var h = 0;
    for (var i = 0; i < tekst.length; i++) h = (h * 31 + tekst.charCodeAt(i)) % 360;
    return h;
  }

  function aantal(n, een, meer) { return n + ' ' + (n === 1 ? een : meer); }

  function heeftNieuw(blok) { return blok.apps.some(isNieuw); }

  // Archief: "archief": true/false in info.json wint. Anders automatisch:
  // de dag na de toetsdatum, of (zonder toetsdatum) een maand nadat het blok is aangemaakt.
  function isArchief(blok) {
    if (blok.archief === true || blok.archief === false) return blok.archief;
    if (blok.toetsdatum) return dagenTot(blok.toetsdatum) < 0;
    var t = new Date(blok.aangemaakt);
    if (isNaN(t)) return false;
    var grens = new Date(t.getFullYear(), t.getMonth() + 1, t.getDate());
    return vandaag() > grens;
  }
  function vakArchief(vak) { return vak.archief === true; }

  /* ---------- Namen (alleen op dit apparaat; zelfde sleutels als _leermodule/v1/leermodule.js) ---------- */
  var NAAM_KEY = 'huiswerk:naam', NAMEN_KEY = 'huiswerk:namen';
  function lees(k, std) { try { var v = localStorage.getItem(k); return v == null ? std : JSON.parse(v); } catch (e) { return std; } }
  function schrijf(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* privévenster */ } }
  function huidigeNaam() { return lees(NAAM_KEY, ''); }
  function alleNamen() { return lees(NAMEN_KEY, []); }
  function kiesNaam(naam) {
    naam = String(naam || '').replace(/\s+/g, ' ').trim().slice(0, 20);
    if (!naam) return false;
    var namen = alleNamen().filter(function (n) { return n.toLowerCase() !== naam.toLowerCase(); });
    namen.unshift(naam);
    schrijf(NAMEN_KEY, namen.slice(0, 12));
    schrijf(NAAM_KEY, naam);
    return true;
  }

  function toetsTekst(blok) {
    var n = dagenTot(blok.toetsdatum);
    if (n === null || n < 0) return '';
    if (n === 0) return 'Toets vandaag!';
    if (n === 1) return 'Toets morgen';
    return 'Toets ' + mooieDatum(blok.toetsdatum);
  }

  function zetKop(titel, terugHref, kruimels) {
    kop.innerHTML =
      (terugHref ? '<a class="terug" href="' + esc(terugHref) + '" aria-label="Terug">←</a>' : '') +
      '<h1>' + titel + '</h1>';
    var oud = document.querySelector('.kruimels');
    if (oud) oud.remove();
    if (kruimels) {
      var nav = document.createElement('nav');
      nav.className = 'kruimels';
      nav.setAttribute('aria-label', 'Kruimelpad');
      nav.innerHTML = kruimels;
      kop.after(nav);
    }
  }

  function vindVak(id) {
    return manifest.vakken.filter(function (v) { return v.id === id; })[0];
  }

  /* ---------- Weergaven ---------- */

  function komendeToetsen() {
    var lijst = [];
    manifest.vakken.forEach(function (vak) {
      if (vakArchief(vak)) return;
      if (vak.toetsdatum && dagenTot(vak.toetsdatum) >= 0) {
        lijst.push({ vak: vak, naam: vak.naam, datum: vak.toetsdatum, href: '#' + vak.id });
      }
      vak.blokken.forEach(function (blok) {
        if (isArchief(blok) || !blok.toetsdatum || dagenTot(blok.toetsdatum) < 0) return;
        lijst.push({ vak: vak, naam: blok.naam, datum: blok.toetsdatum, href: '#' + vak.id + '/' + blok.id });
      });
    });
    lijst.sort(function (a, b) { return a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : 0; });
    if (!lijst.length) return '';
    return '<h2>Komende toetsen</h2><div class="toetsen">' + lijst.map(function (t) {
      var n = dagenTot(t.datum);
      var groot = n === 0 ? '!' : n;
      var klein = n === 0 ? 'vandaag' : n === 1 ? 'dag' : 'dagen';
      return '<a class="toets' + (n <= 3 ? ' binnenkort' : '') + '" href="' + esc(t.href) + '">' +
        '<div class="dagen">' + groot + '<small>' + klein + '</small></div>' +
        '<div class="wat"><strong>' + esc(t.vak.emoji) + ' ' + esc(t.vak.naam) + '</strong>' +
        '<span>' + esc(t.naam) + ' · ' + esc(mooieDatum(t.datum)) + '</span></div></a>';
    }).join('') + '</div>';
  }

  function vakTegel(vak) {
    var actief = vak.blokken.filter(function (b) { return !isArchief(b); });
    var apps = actief.reduce(function (n, b) { return n + b.apps.length; }, 0);
    var inArchief = vak.blokken.length - actief.length;
    var nieuw = actief.some(heeftNieuw);
    return '<a class="tegel" style="--tint:' + tint(vak.id) + '" href="#' + esc(vak.id) + '">' +
      (nieuw ? '<span class="badge">Nieuw</span>' : '') +
      '<span class="emoji" aria-hidden="true">' + esc(vak.emoji) + '</span>' +
      '<span class="naam">' + esc(vak.naam) + '</span>' +
      '<span class="info">' + (actief.length ? aantal(apps, 'app', 'apps') : 'Nu geen blokken') +
      (inArchief ? '<br>' + inArchief + ' in archief' : '') + '</span></a>';
  }

  var IC_BOEK = '<svg class="lm-i" style="width:22px;height:22px;color:var(--zacht)" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 5v16"/></svg>';
  var IC_PEN = '<svg class="lm-i" style="width:22px;height:22px;color:var(--zacht)" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg>';
  var IC_PERSOON = '<svg class="lm-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>';
  var IC_VUUR = '<svg class="lm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4 0 7-2.8 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-3 3-5 5-5 8 0 4.2 3 7 7 7z"/></svg>';
  // Dagen op rij geoefend (de leermodule houdt dit bij per naam).
  function reeks(naam) {
    var d = lees('huiswerk:dagen@' + naam.toLowerCase(), []), n = 0, t = new Date();
    var str = function (x) { return x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2) + '-' + ('0' + x.getDate()).slice(-2); };
    if (d.indexOf(str(t)) < 0) t.setDate(t.getDate() - 1);
    while (d.indexOf(str(t)) >= 0) { n++; t.setDate(t.getDate() - 1); }
    return n;
  }
  function profielKnop() {
    var naam = huidigeNaam(); if (!naam) return '';
    var r = reeks(naam);
    return (r >= 2 ? '<span class="reeks" title="Dagen op rij geoefend">' + IC_VUUR + r + ' dagen</span>' : '') +
      '<a class="profiel" href="#wie" title="Iemand anders? Wissel van naam">' + IC_PERSOON + esc(naam) + '</a>';
  }

  function toonWie() {
    document.title = 'Wie ben jij? · Huiswerk 1BC';
    var naam = huidigeNaam(), namen = alleNamen();
    zetKop('Huiswerk 1BC', naam ? '#' : null);
    inhoud.innerHTML = '<p class="school">De Amersfoortse Berg · klas 1BC</p><section class="wie"><h2>Wie ben jij?</h2>' +
      (namen.length ? '<p style="margin:0 0 8px">Tik op je naam:</p><div class="namen">' + namen.map(function (n) {
        return '<button type="button" data-naam="' + esc(n) + '">' + (n === naam ? '✓ ' : '') + esc(n) + '</button>';
      }).join('') + '</div><p style="margin:0 0 8px">Of typ een nieuwe naam:</p>' : '<p style="margin:0 0 12px">Typ je voornaam. Dan worden jouw oefeningen en cijfers apart bewaard.</p>') +
      '<form id="naamform"><input id="naam" name="naam" maxlength="20" autocomplete="given-name" placeholder="Je voornaam" aria-label="Je voornaam">' +
      '<button type="submit">Start</button></form>' +
      '<p class="klein">Je naam en je resultaten blijven alleen op dit apparaat. Niemand anders kan ze zien, en ze gaan niet naar internet.</p></section>';
    var gekozen = function (n) { if (kiesNaam(n)) { if (location.hash) location.hash = ''; else route(); } };
    document.getElementById('naamform').onsubmit = function (e) { e.preventDefault(); gekozen(document.getElementById('naam').value); };
    inhoud.querySelectorAll('[data-naam]').forEach(function (b) { b.onclick = function () { gekozen(b.dataset.naam); }; });
    if (!namen.length && !matchMedia('(hover: none)').matches) document.getElementById('naam').focus();
  }

  function toonHome() {
    if (!huidigeNaam()) return toonWie();
    document.title = 'Huiswerk 1BC · De Amersfoortse Berg';
    zetKop('Huiswerk 1BC');
    kop.insertAdjacentHTML('beforeend', profielKnop());
    var actief = manifest.vakken.filter(function (v) { return !vakArchief(v); });
    var archief = manifest.vakken.filter(vakArchief);
    var html = '<p class="school">De Amersfoortse Berg · klas 1BC</p><p class="groet">Hoi ' + esc(huidigeNaam()) + '! Wat ga je vandaag doen?</p>' + komendeToetsen();
    html += '<h2>Kies een vak</h2>';
    html += actief.length
      ? '<div class="tegels">' + actief.map(vakTegel).join('') + '</div>'
      : '<p class="leeg">Er staan nog geen vakken klaar.</p>';
    if (archief.length) {
      html += '<details class="archief"><summary>Eerdere vakken (' + archief.length + ')</summary>' +
        '<div class="tegels">' + archief.map(vakTegel).join('') + '</div></details>';
    }
    inhoud.innerHTML = html;
  }

  function blokRij(vak, blok) {
    var sub = [aantal(blok.apps.length, 'app', 'apps')];
    var toets = toetsTekst(blok);
    if (isArchief(blok) && blok.toetsdatum && dagenTot(blok.toetsdatum) < 0) sub.push('toets was ' + mooieDatum(blok.toetsdatum));
    return '<a class="rij" href="#' + esc(vak.id + '/' + blok.id) + '">' +
      '<span class="icoon" aria-hidden="true">' + (blok.emoji ? esc(blok.emoji) : IC_BOEK) + '</span>' +
      '<span class="tekst"><span class="titel">' + esc(blok.naam) +
      (heeftNieuw(blok) && !isArchief(blok) ? ' <span class="badge">Nieuw</span>' : '') +
      (toets ? ' <span class="label">' + esc(toets) + '</span>' : '') + '</span>' +
      '<span class="sub">' + sub.join(' · ') + '</span></span>' +
      '<span class="pijl" aria-hidden="true">›</span></a>';
  }

  function toonVak(vak) {
    document.title = vak.naam + ' · Huiswerk 1BC';
    zetKop(esc(vak.emoji) + ' ' + esc(vak.naam), '#', '<a href="#">Overzicht</a>');
    var actief = vak.blokken.filter(function (b) { return !isArchief(b); });
    var archief = vak.blokken.filter(isArchief).reverse(); // nieuwste eerst
    var html = actief.length
      ? '<div class="lijst">' + actief.map(function (b) { return blokRij(vak, b); }).join('') + '</div>'
      : '<p class="leeg">Op dit moment geen blokken. Oude blokken staan in het archief hieronder.</p>';
    if (archief.length) {
      html += '<details class="archief"' + (actief.length ? '' : ' open') + '><summary>Archief: eerdere blokken (' + archief.length + ')</summary>' +
        '<div class="lijst">' + archief.map(function (b) { return blokRij(vak, b); }).join('') + '</div></details>';
    }
    inhoud.innerHTML = html;
  }

  function appRij(app) {
    return '<a class="rij" href="' + esc(encodeURI(app.pad)) + '?from=index">' +
      '<span class="icoon" aria-hidden="true">' + IC_PEN + '</span>' +
      '<span class="tekst"><span class="titel">' + esc(app.titel) +
      (isNieuw(app) ? ' <span class="badge">Nieuw</span>' : '') + '</span>' +
      (app.omschrijving ? '<span class="sub">' + esc(app.omschrijving) + '</span>' : '') +
      '</span><span class="pijl" aria-hidden="true">›</span></a>';
  }

  function toonBlok(vak, blok) {
    document.title = blok.naam + ' · ' + vak.naam;
    zetKop(esc(blok.emoji || vak.emoji) + ' ' + esc(blok.naam), '#' + vak.id,
      '<a href="#">Overzicht</a> › <a href="#' + esc(vak.id) + '">' + esc(vak.naam) + '</a>');
    var html = '';
    var n = dagenTot(blok.toetsdatum);
    if (n !== null && n >= 0) {
      html += '<p class="leeg" style="margin:0 0 16px;color:var(--tekst)">Toets op <strong>' + esc(mooieDatum(blok.toetsdatum)) +
        '</strong> — ' + (n === 0 ? 'dat is vandaag, succes! 💪' : n === 1 ? 'dat is morgen!' : 'nog ' + n + ' dagen.') + '</p>';
    }
    html += blok.apps.length
      ? '<div class="lijst">' + blok.apps.map(appRij).join('') + '</div>'
      : '<p class="leeg">Hier staan nog geen apps.</p>';
    inhoud.innerHTML = html;
  }

  function toonNietGevonden() {
    zetKop('🤔 Niet gevonden', '#');
    inhoud.innerHTML = '<div class="fout"><div class="groot">🧭</div><p>Deze pagina bestaat (niet meer).</p>' +
      '<p><a href="#">Naar het overzicht</a></p></div>';
  }

  function route() {
    if (!manifest) return;
    var delen = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/').filter(Boolean);
    if (!delen.length) toonHome();
    else if (delen[0] === 'wie') toonWie();
    else {
      var vak = vindVak(delen[0]);
      if (!vak) toonNietGevonden();
      else if (delen.length === 1) toonVak(vak);
      else {
        var blok = vak.blokken.filter(function (b) { return b.id === delen[1]; })[0];
        if (blok) toonBlok(vak, blok); else toonNietGevonden();
      }
    }
    window.scrollTo(0, 0);
  }

  function toonFout(err) {
    zetKop('Huiswerk 1BC');
    var lokaal = location.protocol === 'file:';
    inhoud.innerHTML = '<div class="fout"><div class="groot">😕</div>' +
      '<p><strong>Oeps, het overzicht kon niet geladen worden.</strong></p>' +
      '<p>Controleer of je internet hebt en probeer het opnieuw.</p>' +
      '<button type="button" id="opnieuw">Opnieuw proberen</button>' +
      '<p style="font-size:13px;color:var(--zacht);margin-top:20px">' +
      (lokaal
        ? 'Tip: open deze pagina via een webserver (<code>npx serve .</code>), niet als los bestand.'
        : 'Voor ouders: <code>manifest.json</code> ontbreekt of is ongeldig. Lokaal: <code>node scripts/build-manifest.mjs</code>.') +
      '<br><small>' + esc(err && err.message) + '</small></p></div>';
    document.getElementById('opnieuw').onclick = laad;
  }

  function laad() {
    inhoud.innerHTML = '<p class="leeg">Even laden…</p>';
    fetch('manifest.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data || !Array.isArray(data.vakken)) throw new Error('Onverwachte inhoud');
        manifest = data;
        var g = new Date(data.gegenereerd);
        voet.textContent = (isNaN(g) ? '' : 'Bijgewerkt op ' + g.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' }) + ' · ') +
          'We tellen anoniem hoe vaak de site gebruikt wordt: zonder cookies en zonder namen.';
        route();
      })
      .catch(toonFout);
  }

  window.addEventListener('hashchange', route);
  // Ook vak- en blokpagina's (in de #) apart tellen. De eerste pagina telt GoatCounter zelf.
  window.addEventListener('hashchange', function () {
    try { if (window.goatcounter && window.goatcounter.count && location.hash.length > 1 && location.hash !== '#wie') window.goatcounter.count({ path: location.pathname + location.hash, title: document.title }); } catch (e) { /* teller geblokkeerd */ }
  });
  laad();
})();
</script>
</body>
</html>
