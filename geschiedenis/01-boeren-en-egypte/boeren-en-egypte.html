        { kop: '🎯 Leerdoelen: dit moet je kunnen', open: true, html: `
          <ul>

        { kop: 'Een belangrijke ontdekking', open: true, html: `
          <p>Jagers-verzamelaars leefden onder andere van planten die ze in de natuur verzamelden. Rond <span class="mark">9000 v.C.</span> begonnen kleine groepjes jagers-verzamelaars zelf graan en groenten te verbouwen: <strong>akkerbouw</strong>. Dat ging in heel kleine stapjes: eerst wat graankorrels in de grond stoppen, later ook onkruid wieden en bij droogte water geven.</p>
          <p>De eerste mensen die aan akkerbouw deden, leefden in het <span class="mark">Midden-Oosten</span>.</p>
          <p>Duizenden jaren later begon daar het houden van dieren. Mensen temden runderen, geiten, schapen en varkens. Dat vee gaf melk, vlees en wol: <strong>veeteelt</strong>. De vroegste boeren jaagden nog volop.</p>

            <li><strong>Fase 2 (± 1000 jaar later):</strong> mensen gingen voorzichtig <strong>experimenteren</strong> met zaaien en oogsten. Ze leerden steeds meer over planten en dieren. Graan verbouwen en dieren temmen leverde steeds meer op.</li>

          </ol>
          <p>Waarom juist in het <strong>Midden-Oosten</strong>? Daar groeiden wilde graansoorten en bonen die goed te verbouwen waren, en er leefden dieren die goed te temmen waren (runderen, schapen, geiten, varkens). Ook op andere plekken in de wereld vonden mensen de landbouw uit. Langzaam verspreidde landbouw zich over de hele aardbol.</p>` },

            <li><strong>Sociaal:</strong> de verschillen tussen mensen werden groter. Boerendorpen waren groter: eerst ± <strong>150 inwoners</strong>, rond <strong>7000 v.C.</strong> woonden er in <strong>Jericho</strong> al 2.000 mensen. Je kon niet meer alles samen bespreken, dus sommigen namen de <strong>leiding</strong> en kregen meer macht.</li>

        { kop: '🎯 Leerdoelen: dit moet je kunnen', open: true, html: `
          <ul>
            <li>Uitleggen hoe <strong>irrigatielandbouw</strong> langs de Nijl werkte.</li>
            <li>Uitleggen tot welke <strong>economische</strong> veranderingen het ontstaan van de landbouw in Egypte leidde.</li>

        { kop: 'Landbouw langs de Nijl', open: true, html: `
          <p>Egypte is altijd heel vruchtbaar geweest. In de moerassen rond de monding van de Nijl (de <strong>Nijldelta</strong>) leefden eerst jagers-verzamelaars. Na <span class="mark">4000 v.C.</span> gingen zij langzaam over op landbouw.</p>
          <p>Zo werkte het:</p>
          <ol>
            <li>Elke <strong>zomer</strong> steeg het water van de Nijl, door hevige regen 6.000 km naar het zuiden, midden in Afrika.</li>
            <li>De rivier overstroomde het land en nam <strong>vruchtbaar slib</strong> mee.</li>
            <li>Als het water gezakt was, verbouwden de Egyptenaren hun gewassen op de drooggevallen grond.</li>
            <li>Om het hele jaar water te hebben, legden ze <strong>dijken, waterbekkens en kanaaltjes</strong> aan. Via kanalen konden ze ook akkers verder van de Nijl bevloeien; dijken en bekkens hielden het water zo lang mogelijk vast.</li>
          </ol>
          <p>Deze manier van landbouw heet <span class="mark">irrigatielandbouw</span>.</p>
          <p>Ze verbouwden graan en groenten (uien, sla, bonen), hielden vee, vingen vis en jaagden op wilde dieren bij de Nijl. De Nijl zorgde op allerlei manieren voor voedsel.</p>` },
        { kop: 'Handel en steden (economische veranderingen)', html: `
          <ul>
            <li><strong>Overschot:</strong> door irrigatielandbouw leverden de akkers meer voedsel op dan de boeren zelf nodig hadden. Gevolgen: (1) de bevolking groeide, (2) niet iedereen hoefde nog boer te zijn.</li>
            <li><strong>Specialisatie:</strong> sommige mensen kozen een ander beroep, vooral <span class="mark">nijverheid</span>: met de hand voorwerpen maken, zoals gereedschap, kleding, meubels en sieraden (timmerman, pottenbakker, wever). Niet alles zelf maken, maar één beroep uitoefenen = <span class="mark">specialisatie</span>.</li>
            <li><strong>Handel:</strong> vaklui ruilden hun werk of producten tegen voedsel of andere spullen. Zo ontstond <span class="mark">handel</span>, ook met gebieden buiten Egypte (ivoor, hout, vee, kostbare stenen).</li>
            <li><strong>Steden:</strong> dorpen langs de Nijl groeiden uit tot steden, zoals <strong>Memphis</strong> en <strong>Thebe</strong>. Daar woonden handwerkslieden, bestuurders, priesters, handelaren én boeren: samen een <span class="mark">stedelijke gemeenschap</span>.</li>
            <li><strong>Uitvindingen:</strong> pottenbakkersschijf, wiel, ploeg en maalstenen voor graan. Mensen ontdekten <strong>brons</strong> (koper + tin samensmelten). Vanaf <span class="mark">3000 v.C.</span> werden stenen werktuigen vervangen door bronzen werktuigen. Brons kon je gieten, dus je kon er veel meer vormen mee maken dan met steen.</li>
          </ul>
          <p class="tip">Keten om te onthouden: irrigatie → overschot → bevolkingsgroei + specialisatie → handel → steden.</p>` },
        { kop: 'Verschillen in rijkdom en macht (sociale veranderingen)', html: `
          <p>In Egypte waren de verschillen in rijkdom en macht veel groter dan bij jagers-verzamelaars. Dat kwam door het bezit van land en vee, de nieuwe beroepen en het ontstaan van een bestuur. Egypte kreeg verschillende <span class="mark">sociale lagen</span>, van weinig naar veel aanzien:</p>

            <li><strong>Boeren</strong>: verreweg de grootste groep, weinig aanzien.</li>
            <li><strong>Eenvoudige handwerkslieden</strong>: ook weinig aanzien.</li>
            <li><strong>Goed geschoolde mensen</strong>, zoals schrijvers en bouwmeesters: veel meer respect.</li>
            <li><strong>Belangrijke bestuurders en mensen met godsdienstige taken</strong>: het meeste aanzien en gezag.</li>
          </ol>
          <p>Bovenaan stond de <span class="mark">farao</span>, de koning van Egypte. Hij had de meeste macht en bezat veel land. De machtigste farao's lieten <strong>piramides</strong> bouwen als grafmonument, zodat iedereen zag hoe belangrijk ze waren.</p>
          <p><strong>Vrouwen:</strong> we weten het niet precies, want alles is opgeschreven door mannen. Vrouwen konden geen hoge bestuurder worden, maar hadden meer rechten dan in andere samenlevingen: ze mochten eigendom hebben en hadden bij de rechtbank dezelfde rechten als mannen. In het dagelijks leven zorgden ze vooral voor huishouden en kinderen.</p>` },

            <li><strong>Bron 4:</strong> ketting uit het graf van een hoge bestuurder (ca. 1450 v.C.): rijke mensen lieten hun rijkdom zien, ook in hun graf.</li>
