        {kop: "Als je veel weet, beleef je meer", html: `

        {kop: "Woorden raden uit de context", open: true, html: `
<p>Hoe meer woorden je kent, hoe meer je begrijpt. Een nieuw woord kun je opzoeken, maar vaak kun je de betekenis ook afleiden uit de <span class="mark">context</span>: de rest van de zin of tekst.</p>

        {kop: "De 6 woordraadstrategieën", open: true, html: `
<ul>
<li><strong>Uitleg in de zin</strong> – het woord wordt uitgelegd in dezelfde of de volgende zin.<br><em>Voorbeeld: een hypochonder denkt steeds dat hij een erge ziekte heeft.</em></li>
<li><strong>Synoniem in de buurt</strong> – een woord met (bijna) dezelfde betekenis staat vlakbij.<br><em>Furieus … zo kwaad → furieus = heel erg boos.</em></li>
<li><strong>Tegenstelling (antoniem) in de buurt</strong> – een woord met de tegenovergestelde betekenis staat vlakbij. Let op woorden als <em>juist, maar, terwijl</em>.<br><em>Negatieve recensies ↔ juist goede reacties.</em></li>
<li><strong>Samenstelling</strong> – je kent een deel van het woord.<br><em>Geesteskind: je kent ‘kind’ → iets wat iemand heeft bedacht of gemaakt.</em></li>
<li><strong>Voorvoegsel of achtervoegsel</strong> – een stukje vóór of achter het woord verandert de betekenis.<br><em>In-actief: ‘in-’ betekent hier ‘niet’.</em></li>
<li><strong>Lijkt op een woord dat je kent</strong> – bijvoorbeeld uit een andere taal.<br><em>Causaal lijkt op Engels cause (oorzaak) en because (omdat).</em></li>
</ul>
<p class="tip">Werkt dit allemaal niet? Vraag het aan iemand of zoek het woord op in een (online) woordenboek.</p>`},
        {kop: "Vaktaal en begrippen", html: `
<p>Schoolboeken staan vol vaktermen en begrippen die je moet kennen. Een goede strategie: <span class="mark">leg ze uit aan iemand anders</span>. Die ander hoeft er niet echt te zijn, je kunt het ook in je hoofd doen.</p>`},
        {kop: "Zo pas je het toe: stappenplan", open: true, html: `
<p>Je komt een woord tegen dat je niet kent. Werk dan zo:</p>
<ol>
<li><strong>Lees de hele zin</strong>, en ook de zin ervoor en erna.</li>
<li><strong>Zoek een uitleg.</strong> Let op een dubbele punt, of woorden als <em>dat wil zeggen, dus, oftewel, dat betekent</em>.</li>
<li><strong>Zoek een synoniem of tegenstelling.</strong> Signaalwoorden voor een tegenstelling: <em>maar, juist, terwijl, in plaats van, toch</em>.</li>
<li><strong>Kijk naar het woord zelf.</strong> Is het een samenstelling met een deel dat je kent? Zit er een voor- of achtervoegsel aan? Lijkt het op een Engels woord?</li>
<li><strong>Controleer je gok:</strong> vul jouw betekenis in de zin in. Klopt de zin nog?</li>
<li><strong>Lukt het niet?</strong> Vraag het aan iemand of zoek het op in een (online) woordenboek.</li>
</ol>`},
        {kop: "Voorbeelden uitgewerkt", html: `
<ul>
<li><em>‘Na de lange tocht was Sam <span class="mark">uitgeput</span>: hij viel meteen in slaap.’</em><br>Na de dubbele punt staat de uitleg → uitgeput = heel erg moe. <strong>Strategie: uitleg in de zin.</strong></li>
<li><em>‘Mijn zus is erg <span class="mark">spraakzaam</span>, maar mijn broer zegt juist bijna niets.’</em><br>‘Maar’ en ‘juist’ wijzen op een tegenstelling → spraakzaam = veel praten. <strong>Strategie: tegenstelling.</strong></li>
<li><em>‘De coach was <span class="mark">woedend</span>. Zo boos had ik hem nog nooit gezien.’</em><br>Boos staat vlakbij en betekent ongeveer hetzelfde. <strong>Strategie: synoniem.</strong></li>
<li><em>‘De <span class="mark">museumgids</span> liet ons de schilderijen zien.’</em><br>Museum + gids → iemand die je rondleidt in een museum. <strong>Strategie: samenstelling.</strong></li>
<li><em>‘Deze paddenstoel is <span class="mark">oneetbaar</span>.’</em><br>On- (niet) + eet + -baar (kan) → kun je niet eten. <strong>Strategie: voor- en achtervoegsel.</strong></li>
<li><em>‘Het verslag was heel <span class="mark">gedetailleerd</span>.’</em><br>Lijkt op het Engelse <em>detailed</em> → met veel details. <strong>Strategie: lijkt op woord uit andere taal.</strong></li>
</ul>`},

<tr><td>in-</td><td>niet</td><td>inactief, incorrect, informeel</td></tr>
<tr><td>her-</td><td>opnieuw</td><td>herhalen, herkansing</td></tr>
<tr><td>-loos</td><td>zonder</td><td>kleurloos, draadloos</td></tr>
<tr><td>-baar</td><td>kan (gedaan worden)</td><td>eetbaar, leesbaar</td></tr>
<tr><td>-achtig</td><td>lijkt op</td><td>kinderachtig, groenachtig</td></tr>
</tbody></table>
<p class="tip">Let op: niet elk woord dat met <em>in</em> begint, heeft het voorvoegsel ‘niet’. <em>Invullen</em> betekent niet ‘niet vullen’!</p>`}
